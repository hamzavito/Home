# Supabase CLI-konfiguration (bruges af `supabase link` / `supabase db push`).
project_id = "hjem"

[auth]
# Indsæt jeres Vercel-URL her, så evt. links i e-mails peger på appen.
site_url = "http://localhost:5173"
# Ingen offentlig tilmelding – brugere oprettes manuelt i dashboardet.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

# Kaldes af Supabase Cron med en delt hemmelighed (x-cleanup-secret), ikke med en brugers JWT.
[functions.cleanup-receipts]
verify_jwt = false

# Kaldes af private.push_tick() (pg_net) med en delt hemmelighed (x-push-secret).
[functions.send-push]
verify_jwt = false

# Kræver login (JWT); funktionen tjekker desuden selv, at det er en rigtig bruger.
[functions.import-recipe]
verify_jwt = true

[functions.child-login]
# Kaldes før login. Kontrol og rate limit sker i databasen.
verify_jwt = false

[functions.child-admin]
verify_jwt = true
