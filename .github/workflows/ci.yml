name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:contrast
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:pwa

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Migrations + RLS-tests mod en midlertidig Postgres (forudinstalleret på runneren)
      - run: bash supabase/tests/run-local.sh

  e2e:
    runs-on: ubuntu-latest
    # Match the version pinned in package-lock.json; browser/system libraries
    # are preinstalled so transient Ubuntu apt DNS failures cannot block tests.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Appen bygges med den lokale demo-backend og testes i lyst og mørkt tema (inkl. axe-kontrast)
      - run: npm run test:e2e
        env:
          CI: true
      # Ved fejl: skærmbillede og fejlkontekst, så en ustabil test kan undersøges
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-fejl
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
